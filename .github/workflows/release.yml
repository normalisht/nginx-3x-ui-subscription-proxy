# Релиз: сборка образа после вмержа в main и автоматический деплой на VPS.
# Деплой — джоба deploy (needs: build-push): выкатывается сразу, без ручных одобрений.
# Откат и ручной перевыкат — workflow_dispatch с указанием тега образа (docs/DEPLOY.md).
name: Релиз

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Тег образа в GHCR: sha коммита или latest (ручной запуск — обычно откат)"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/normalisht/nginx-3x-ui-subscription-proxy

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    # При ручном запуске тег может указывать на старый образ (откат) — деплоим его же.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Обновить сервис на VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          # Автодеплой — образ собран этой же сборкой (sha); ручной — тег из input.
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          umask 077
          install -m 600 /dev/null ssh_key
          printf '%s\n' "$SSH_KEY" > ssh_key
          cleanup() { rm -f ssh_key; }
          trap cleanup EXIT
          ssh -i ssh_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_DIR' \
             && git pull --ff-only \
             && docker compose pull \
             && IMAGE_TAG='$IMAGE_TAG' docker compose up -d --wait"
      - name: Healthcheck
        run: |
          # --wait уже дождался healthy; здесь — повторная проверка снаружи, через боевой домен.
          sleep 5
          curl -fsS --max-time 10 "https://config.normanproject.ru/healthz" > /dev/null
