# CI по PR: линтер + make check (gofmt, go vet, тесты).
# Инструменты запускаются через go run / action — ставить отдельно не нужно.
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: make check
        run: make check
